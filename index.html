function render(){let h=H[current],rate=+document.getElementById('rate').value,total=h.energyCost+h.days*rate,max=Math.max(...h.months.map(x=>x.kwh)),parts=[h.hours.slice(0,6),h.hours.slice(6,12),h.hours.slice(12,18),h.hours.slice(18,24)].map(a=>a.reduce((x,y)=>x+y,0)),psum=parts.reduce((x,y)=>x+y,0),standPct=Math.min(100,Math.round(h.standbyShare));document.getElementById('app').innerHTML=`<div class="overview">${H.map((x,i)=>`<div class="overviewCard ${i==current?'active':''}"><div><span class="houseIcon">⌂</span><b>${x.name}</b></div><div class="big">${fmt(x.daily)} kWh/dia</div><div class="small">${eur(x.energyCost+x.days*rate)} por ano</div><div class="meter"><i style="width:${x.total/Math.max(...H.map(y=>y.total))*100}%"></i></div></div>`).join('')}</div><div class="top"><div><h2>${h.name}</h2><div class="cpe">${h.cpe} · ${h.start} a ${h.end}</div></div><select class="select" id="rate2"><option value="0.48" ${rate==.48?'selected':''}>Termo diário: 0,48 €</option><option value="0.80" ${rate==.8?'selected':''}>Termo diário: 0,80 €</option></select></div><section class="kpis"><div class="card"><div class="label">Consumo médio por dia</div><div class="big">${fmt(h.daily)} kWh</div><div class="small">equivale a ${eur(h.daily*.1399)} de energia/dia</div></div><div class="card standby ${h.sbcolor}"><div class="label">Consumo em standby</div><div class="visualKpi"><div class="round" style="--pct:${standPct}%"><span>${standPct}%</span></div><div><div class="big">${h.standbyW} W</div><div class="small">${h.sbtxt} · cerca de ${eur(h.standbyCost)}/ano</div></div></div></div><div class="card"><div class="label">Média mensal</div><div class="big">${fmt(h.monthlyAvg)} kWh</div><div class="small">aproximadamente ${eur(h.monthlyAvg*.1399)} em energia</div></div><div class="card"><div class="label">Estimativa anual</div><div class="big">${eur(total)}</div><div class="small">energia + termo diário escolhido</div></div></section><div class="alert"><div class="alertIcon">💡</div><div><b>Principal conclusão</b><br>${h.trend}</div></div><div class="layout"><section class="panel"><h3>Como o consumo muda ao longo do ano</h3><p class="hint">As barras maiores mostram os meses que mais pesam na conta.</p><div class="bars">${h.months.map(x=>`<div class="barcol"><span class="barval">${Math.round(x.kwh)}</span><div class="bar" style="height:${x.kwh/max*82}%"></div><span class="barlabel">${x.short}</span></div>`).join('')}</div></section><section class="panel decision"><h3>O que importa saber</h3><p>${h.trend}</p><div class="facts"><div class="fact"><span class="icon">↑</span><div><b>Mês mais caro</b>${h.maxm.label}: ${fmt(h.maxm.kwh)} kWh</div></div><div class="fact"><span class="icon">↓</span><div><b>Mês mais baixo</b>${h.minm.label}: ${fmt(h.minm.kwh)} kWh</div></div><div class="fact"><span class="icon">◷</span><div><b>Hora de maior consumo</b>Por volta das ${String(h.maxh).padStart(2,'0')}:00</div></div></div></section></div><div class="layout"><section class="panel"><h3>A que horas se consome mais?</h3><p class="hint">Perfil médio de um dia. Quanto mais alta a linha, maior o consumo nessa hora.</p><canvas id="hour"></canvas></section><section class="panel"><h3>Quanto custa este consumo?</h3><div class="costrow"><div class="cost"><span class="small">Só energia</span><strong>${eur(h.energyCost)}</strong><span class="small">${fmt(h.total)} kWh × 0,1399 €</span></div><div class="cost"><span class="small">Termo fixo</span><strong>${eur(h.days*rate)}</strong><span class="small">${h.days} dias × ${rate.toLocaleString('pt-PT')} €</span></div></div><p class="note">Total estimado: <b>${eur(total)}</b>. Não inclui IVA, impostos, contribuição audiovisual ou outras taxas.</p><h3 style="margin-top:20px">Dias com maior consumo</h3><ol class="rank">${h.topdays.map(x=>`<li><span>${x.d}</span><b>${fmt(x.v)} kWh</b></li>`).join('')}</ol></section></div><section class="panel" style="margin-top:14px"><h3>Em que parte do dia se concentra o consumo?</h3><p class="hint">D
