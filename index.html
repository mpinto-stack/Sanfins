<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consumos das casas</title><style>:root{--b:#2477da;--ink:#17324b;--mut:#6c8094;--bg:#f2f7fb;--line:#dfe8f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui,Segoe UI,sans-serif;color:var(--ink)}header{background:linear-gradient(125deg,#12385f,#348df2);color:#fff;padding:28px 18px 64px}header div,main{max-width:1050px;margin:auto}h1{margin:0 0 5px}.sub{opacity:.8}main{margin-top:-40px;padding:0 12px 30px}.tabs{display:flex;gap:8px;position:sticky;top:0;z-index:5;padding:8px 0;overflow:auto}.tab{border:0;border-radius:30px;padding:12px 20px;min-height:44px;font-weight:800;color:#35546f;white-space:nowrap}.tab.on{background:#fff;color:var(--b);box-shadow:0 5px 18px #1234}.title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0;flex-wrap:wrap}.title h2{margin:0}.cpe{color:var(--mut);font-size:12px}.select{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 8px 26px #3152730d}.lab{font-size:11px;text-transform:uppercase;font-weight:800;color:var(--mut)}.big{font-size:27px;font-weight:900;margin:7px 0}.small{color:var(--mut)}.layout{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-top:12px}.alert{margin-top:12px;border-left:5px solid #f2a93b;background:#fff8e8}.bars{display:flex;align-items:end;gap:8px;height:245px;border-bottom:1px solid var(--line)}.bc{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center}.bar{width:75%;background:linear-gradient(#70baff,#287ddd);border-radius:7px 7px 2px 2px}.lbl{font-size:10px;color:var(--mut);padding:5px 0}.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.part{padding:14px 6px;text-align:center;border-radius:14px;color:white}.part:nth-child(1){background:#465c8f}.part:nth-child(2){background:#37a6da}.part:nth-child(3){background:#eba437}.part:nth-child(4){background:#725cac}.part b{display:block;font-size:22px}.cost{font-size:32px;font-weight:900;color:var(--b)}.foot{font-size:12px;color:var(--mut);margin-top:15px}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.tabs{background:#f2f7fb}.bars{height:210px}.title select{width:100%;min-height:44px}}@media(max-width:420px){header{padding:22px 13px 58px}h1{font-size:25px}.grid{grid-template-columns:1fr}.card,.panel{padding:14px}.parts{grid-template-columns:1fr 1fr}.big{font-size:25px}.bar{width:85%}.tabs{margin:0 -12px;padding:8px 12px;scroll-snap-type:x mandatory}.tab{scroll-snap-align:start}}</style></head><body><header><div><h1>Consumos das casas</h1><div class="sub">Uma visão simples para tomar decisões</div></div></header><main><nav class="tabs" id="tabs"></nav><div id="app"></div><div class="foot">Estimativa: consumo × 0,1399 €/kWh + termo diário. Não inclui IVA, impostos, contribuição audiovisual ou outras taxas. O standby é estimado pelo consumo típico entre as 02:00 e as 05:00.</div></main><script>
const houses=[{name:'Casa Guilherme',cpe:'PT0002000036078945ZK',total:5044,daily:13.8,standby:90,month:420,max:'Dezembro',maxv:902,min:'Outubro',minv:145,peak:'início da noite',trend:'O maior peso está nos meses de inverno. A principal decisão é rever a programação do aquecimento.',months:[540,902,834,657,420,290,255,220,205,180,145,152],parts:[8,25,34,33]},{name:'Casa Carlos',cpe:'PT0002000036078934ZX',total:15581.1,daily:42.7,standby:1304,month:1298.4,max:'Janeiro',maxv:2439.6,min:'Setembro',minv:527.7,peak:'20:00',trend:'O consumo de inverno e o standby são elevados. A prioridade é identificar aquecimento, termoacumulador ou outros equipamentos ligados durante a noite.',months:[1450,2356,2440,1944,1767,1114,1076,603,596,632,528,698],parts:[25,22,24,29]}];let cur=0,rate=.48;const eur=n=>n.toLocaleString('pt-PT',{style:'currency',currency:'EUR'}),num=n=>n.toLocaleString('pt-PT',{maximumFractionDigits:1});
function render(){let h=houses[cur],max=Math.max(...h.months),energy=h.total*.1399,total=energy+365*rate;app.innerHTML=`<div class="title"><div><h2>${h.name}</h2><div class="cpe">${h.cpe}</div></div><select class="select" id="rate"><option value=".48">Termo diário: 0,48 €</option><option value=".8" ${rate==.8?'selected':''}>Termo diário: 0,80 €</option></select></div><section class="grid"><div class="card"><div class="lab">Média por dia</div><div class="big">${num(h.daily)} kWh</div><div class="small">${eur(h.daily*.1399)} de energia/dia</div></div><div class="card"><div class="lab">Standby estimado</div><div class="big">${h.standby} W</div><div class="small">cerca de ${eur(h.standby/1000*24*365*.1399)}/ano</div></div><div class="card"><div class="lab">Média mensal</div><div class="big">${num(h.month)} kWh</div><div class="small">${eur(h.month*.1399)} em energia</div></div><div class="card"><div class="lab">Estimativa anual</div><div class="big">${eur(total)}</div><div class="small">energia + termo diário</div></div></section><section class="panel alert"><b>💡 Principal conclusão</b><br>${h.trend}</section><div class="layout"><section class="panel"><h3>Consumo ao longo do ano</h3><div class="bars">${h.months.map((v,i)=>`<div class="bc"><div class="small">${Math.round(v)}</div><div class="bar" style="height:${v/max*75}%"></div><div class="lbl">${['Nov','Dez','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out'][i]}</div></div>`).join('')}</div></section><section class="panel"><h3>O que importa saber</h3><p><b>Mês mais alto:</b> ${h.max}, ${num(h.maxv)} kWh</p><p><b>Mês mais baixo:</b> ${h.min}, ${num(h.minv)} kWh</p><p><b>Maior consumo:</b> ${h.peak}</p><h3>Custo estimado</h3><div class="cost">${eur(total)}</div><p class="small">Energia: ${eur(energy)}<br>Termo fixo: ${eur(365*rate)}</p></section></div><section class="panel" style="margin-top:12px"><h3>Em que parte do dia se consome?</h3><div class="parts">${['🌙 Madrugada','☀️ Manhã','🌤️ Tarde','🌆 Noite'].map((x,i)=>`<div class="part">${x}<b>${h.parts[i]}%</b></div>`).join('')}</div></section>`;document.getElementById('rate').onchange=e=>{rate=+e.target.value;render()}}
const tabs=document.getElementById('tabs'),app=document.getElementById('app');houses.forEach((h,i)=>{let b=document.createElement('button');b.className='tab'+(i?'':' on');b.textContent=h.name;b.onclick=()=>{cur=i;[...tabs.children].forEach((x,j)=>x.classList.toggle('on',i==j));render()};tabs.appendChild(b)});render();
</script></body></html>
